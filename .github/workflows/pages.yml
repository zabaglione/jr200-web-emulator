name: pages

on:
  workflow_run:
    workflows: [source-and-codec]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm this is still the main commit
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_SHA"
      - name: Install Emscripten 6.0.9
        shell: bash
        run: |
          set -euo pipefail
          git init build/emsdk
          git -C build/emsdk remote add origin https://github.com/emscripten-core/emsdk.git
          git -C build/emsdk fetch --depth=1 origin a2b92777574c2feda07994cd4f1079a3dfc151f8
          git -C build/emsdk checkout --detach FETCH_HEAD
          build/emsdk/emsdk install 6.0.9
          build/emsdk/emsdk activate 6.0.9
      - name: Build and verify the distributable site
        shell: bash
        run: |
          set -euo pipefail
          source build/emsdk/emsdk_env.sh
          export PATH="$(dirname "$EMSDK_NODE"):$PATH"
          node --version
          make wasm
          make check
      - name: Upload only the staged site
        if: github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy:
    if: github.event.repository.visibility == 'public' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm this is still the main commit
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)"
          test "$CURRENT_SHA" = "$SOURCE_SHA"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
